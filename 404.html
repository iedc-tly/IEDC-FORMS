<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Event Registration...</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var repoName = 'register';
      
      // Clean path and split segments
      var segments = path.split('/').filter(Boolean);
      
      // Find slug: the last non-empty segment that is not an .html file or repo root
      var slug = '';
      if (segments.length > 0) {
        var last = segments[segments.length - 1];
        if (last && !last.endsWith('.html') && last !== repoName && last !== 'Register_forms') {
          slug = last;
        }
      }
      
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Determine base URL (accounting for GitHub Pages repository subfolder)
      var isRepo = path.indexOf('/' + repoName) === 0;
      var base = window.location.origin + (isRepo ? '/' + repoName + '/' : '/');
      
      if (slug) {
        var target = base + 'index.html?form=' + encodeURIComponent(slug);
        if (search) {
          target += '&' + search.replace(/^\?/, '');
        }
        if (hash) {
          target += hash;
        }
        window.location.replace(target);
      } else {
        window.location.replace(base + (search || '') + (hash || ''));
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #475569;">
  <div style="text-align: center; padding: 20px;">
    <div style="width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
    <p style="font-size: 1.05rem; font-weight: 600; margin: 0 0 6px;">Loading Event Registration...</p>
    <p style="font-size: 0.85rem; color: #94a3b8; margin: 0;">Redirecting to your event...</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
